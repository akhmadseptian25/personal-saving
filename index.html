<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <!-- Agar responsive di HP -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Saving Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" type="image/png" href="favicon.ico">
</head>

<body>

    <!-- ==============================
         SIDEBAR
    =============================== -->
    <aside class="sidebar">

        <div class="logo">
            Personal Saving
        </div>

        <nav class="navigation">

            <button class="nav-item active" data-page="dashboard">
                <span>🏠</span>
                <span>Dashboard</span>
            </button>

            <button class="nav-item" data-page="budgeting">
                <span>💰</span>
                <span>Budgeting</span>
            </button>

            <button class="nav-item" data-page="transactions">
                <span>📝</span>
                <span>Input Tabungan</span>
            </button>

            <button class="nav-item" data-page="settings">
                <span>⚙️</span>
                <span>Setting</span>
            </button>

        </nav>

    </aside>


    <!-- ==============================
         MAIN CONTENT
    =============================== -->
    <main class="main-content">

        <!-- HEADER -->
        <header class="topbar">

            <button class="menu-toggle" id="menuToggle">
                ☰
            </button>

            <h1 id="pageTitle">
                Dashboard
            </h1>

        </header>


        <!-- AREA KONTEN -->
        <section class="content" id="app">

            <h2>Selamat Datang 👋</h2>

            <p>
                Personal Saving Dashboard
            </p>

        </section>

    </main>


    <!-- ==============================
         MOBILE NAVIGATION
    =============================== -->
    <nav class="mobile-navigation">

        <button class="mobile-nav-item active"
                data-page="dashboard">

            <span>🏠</span>
            <span>Home</span>

        </button>


        <button class="mobile-nav-item"
                data-page="budgeting">

            <span>💰</span>
            <span>Budget</span>

        </button>


        <button class="mobile-nav-item"
                data-page="transactions">

            <span>📝</span>
            <span>Input</span>

        </button>


        <button class="mobile-nav-item"
                data-page="settings">

            <span>⚙️</span>
            <span>Setting</span>

        </button>

    </nav>


    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script src="js/storage.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/budgeting.js"></script>
    <script src="js/transactions.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
